<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Book Select</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  form { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
  form input, form select { padding: 0.3rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; }
  th:first-child, td:first-child { width: 2rem; }
  .pager { display: flex; gap: 0.5rem; align-items: center; margin-top: 1rem; }
  .meta { color: #666; font-size: 0.9rem; margin-bottom: 0.5rem; }
  .toolbar { margin-bottom: 0.5rem; }
  .edit-bar { display: none; gap: 0.5rem; margin-bottom: 0.5rem; }
  .edit-bar button:disabled { opacity: 0.5; }
  td input, td select { padding: 0.2rem; width: 100%; box-sizing: border-box; }
  #error { color: #c00; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<h1>Book Select</h1>

<form id="filterForm">
  <select name="category">
    <option value="">カテゴリ（全て）</option>
    <option value="小説">小説</option>
    <option value="技術書">技術書</option>
    <option value="漫画">漫画</option>
    <option value="その他">その他</option>
  </select>
  <input type="number" name="min_price" placeholder="min_price" />
  <input type="number" name="max_price" placeholder="max_price" />
  <input type="text" name="keyword" placeholder="keyword（タイトル検索）" />
  <select name="sort_by">
    <option value="">sort_by（なし）</option>
    <option value="id">id</option>
    <option value="price">price</option>
    <option value="created_at">created_at</option>
  </select>
  <select name="order">
    <option value="asc">asc</option>
    <option value="desc">desc</option>
  </select>
  <button type="submit">検索</button>
</form>

<div class="toolbar">
  <button id="editModeBtn">編集モード</button>
</div>

<div id="editBar" class="edit-bar">
  <button id="editSelectedBtn" disabled>選択項目を編集</button>
  <button id="deleteSelectedBtn" disabled>選択項目を削除</button>
</div>

<div id="error"></div>
<div class="meta" id="meta"></div>

<table>
  <thead id="tableHead">
    <tr><th>id</th><th>title</th><th>category</th><th>price</th><th>created_at</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<div class="pager">
  <button id="prevBtn">← 前へ</button>
  <span id="pageLabel"></span>
  <button id="nextBtn">次へ →</button>
</div>

<script>
const CATEGORY_OPTIONS = ["小説", "技術書", "漫画", "その他"];

let page = 1;
const pageSize = 10;
let editMode = false;
let selected = new Set();
let editingId = null;
let lastItems = [];

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderHead() {
  const base = ["id", "title", "category", "price", "created_at"];
  let html = "<tr>";
  if (editMode) html += "<th></th>";
  html += base.map((h) => `<th>${h}</th>`).join("");
  if (editMode) html += "<th>操作</th>";
  html += "</tr>";
  document.getElementById("tableHead").innerHTML = html;
}

function renderRow(b) {
  if (editingId === b.id) {
    const options = CATEGORY_OPTIONS.map(
      (c) => `<option value="${c}" ${c === b.category ? "selected" : ""}>${c}</option>`
    ).join("");
    return `
      <tr data-id="${b.id}">
        <td></td>
        <td><input type="text" class="edit-title" value="${escapeHtml(b.title)}"></td>
        <td><select class="edit-category">${options}</select></td>
        <td><input type="number" class="edit-price" value="${b.price}" step="0.01"></td>
        <td>${b.created_at}</td>
        <td>
          <button class="save-btn" data-id="${b.id}">保存</button>
          <button class="cancel-btn">キャンセル</button>
        </td>
      </tr>`;
  }

  const checked = selected.has(b.id) ? "checked" : "";
  return `
    <tr>
      ${editMode ? `<td><input type="checkbox" class="row-check" data-id="${b.id}" ${checked}></td>` : ""}
      <td>${b.id}</td><td>${escapeHtml(b.title)}</td><td>${b.category}</td><td>${b.price}</td><td>${b.created_at}</td>
      ${editMode ? "<td></td>" : ""}
    </tr>`;
}

function updateEditBarState() {
  document.getElementById("editSelectedBtn").disabled = selected.size !== 1;
  document.getElementById("deleteSelectedBtn").disabled = selected.size === 0;
}

function attachRowListeners() {
  document.querySelectorAll(".row-check").forEach((cb) => {
    cb.addEventListener("change", () => {
      const id = Number(cb.dataset.id);
      if (cb.checked) selected.add(id); else selected.delete(id);
      updateEditBarState();
    });
  });
  document.querySelectorAll(".save-btn").forEach((btn) => {
    btn.addEventListener("click", () => saveEdit(Number(btn.dataset.id)));
  });
  document.querySelectorAll(".cancel-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      editingId = null;
      renderRows();
    });
  });
}

function renderRows() {
  renderHead();
  document.getElementById("rows").innerHTML = lastItems.map(renderRow).join("");
  attachRowListeners();
  updateEditBarState();
}

async function load() {
  const form = new FormData(document.getElementById("filterForm"));
  const params = new URLSearchParams({ page, page_size: pageSize });
  for (const [key, value] of form.entries()) {
    if (value) params.set(key, value);
  }

  const res = await fetch(`/books?${params.toString()}`);
  const errorEl = document.getElementById("error");
  const data = await res.json();

  if (!res.ok) {
    errorEl.textContent = JSON.stringify(data.detail);
    lastItems = [];
    document.getElementById("rows").innerHTML = "";
    document.getElementById("meta").textContent = "";
    return;
  }
  errorEl.textContent = "";

  lastItems = data.items;
  renderRows();

  document.getElementById("meta").textContent =
    `total: ${data.total} / page ${data.page} of ${data.total_pages}`;
  document.getElementById("pageLabel").textContent = `${data.page} / ${data.total_pages || 1}`;
  document.getElementById("prevBtn").disabled = data.page <= 1;
  document.getElementById("nextBtn").disabled = data.page >= data.total_pages;
}

async function saveEdit(id) {
  const row = document.querySelector(`tr[data-id="${id}"]`);
  const body = {
    title: row.querySelector(".edit-title").value.trim(),
    category: row.querySelector(".edit-category").value,
    price: parseFloat(row.querySelector(".edit-price").value),
  };

  const res = await fetch(`/books/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  const errorEl = document.getElementById("error");

  if (!res.ok) {
    errorEl.textContent = JSON.stringify(data.detail);
    return;
  }
  errorEl.textContent = "";
  editingId = null;
  selected.clear();
  load();
}

function resetSelection() {
  selected.clear();
  editingId = null;
}

document.getElementById("filterForm").addEventListener("submit", (e) => {
  e.preventDefault();
  page = 1;
  resetSelection();
  load();
});
document.getElementById("prevBtn").addEventListener("click", () => { page--; resetSelection(); load(); });
document.getElementById("nextBtn").addEventListener("click", () => { page++; resetSelection(); load(); });

document.getElementById("editModeBtn").addEventListener("click", () => {
  editMode = !editMode;
  resetSelection();
  document.getElementById("editModeBtn").textContent = editMode ? "編集モードを終了" : "編集モード";
  document.getElementById("editBar").style.display = editMode ? "flex" : "none";
  renderRows();
});

document.getElementById("editSelectedBtn").addEventListener("click", () => {
  editingId = [...selected][0];
  renderRows();
});

document.getElementById("deleteSelectedBtn").addEventListener("click", async () => {
  if (!confirm(`選択した ${selected.size} 件を削除しますか？`)) return;
  const ids = [...selected];
  await Promise.all(ids.map((id) => fetch(`/books/${id}`, { method: "DELETE" })));
  resetSelection();
  load();
});

load();
</script>
</body>
</html>
